        <script>

            function cancelBooking(id) {
                if (confirm("Are you sure you want to cancel this booking?")) {

                    bookings = JSON.parse(localStorage.getItem("bookings")) || [];

                    bookings.forEach(function(booking) {

                        if (booking.id == id && booking.user == "Byron") {
                            booking.status = "Cancelled by Byron";
                        }

                    });

                    localStorage.setItem("bookings", JSON.stringify(bookings));

                    if (bookings.length > 0 && bookings.every(function(booking) {
                            return booking.status == "Cancelled by Byron" ||
                                booking.status == "Cancelled by Admin";
                        })) {
                            localStorage.removeItem("bookings");
                        }

                    showMyBookings();

                    alert("Booking cancelled successfully.")
                }
            }

            function showMyBookings() {
                bookings = JSON.parse(localStorage.getItem("bookings")) || []

                document.getElementById("myBookings").innerHTML = "";

                bookings.forEach(function(booking) {
                    if (booking.user == "Byron") {

                        document.getElementById("myBookings").innerHTML += 
                            "<div class = 'booking-card'>" + 
                                "<div class = 'booking-info'>" +
                                    "<h3>" + booking.f + "</h3>" +
                                    "<p>Status: " + booking.status + "</p>" +
                                "</div>" +
                                (booking.status == "Confirmed"
                                    ? "<button class = 'cancel-button' onClick='cancelBooking(" + booking.id + ")'>Cancel</button>"
                                    : "") + 
                            "</div>";
                    }
                });

                if (document.getElementById("myBookings").innerHTML == "") {
                    document.getElementById("myBookings").innerHTML =
                    "<p class='page-description'>You have no bookings yet.</p>";
                }
            }

            window.onload = showMyBookings;
        </script>
